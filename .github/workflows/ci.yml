name: UpTrendifyOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-publishable-key' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Supabase config unit smoke test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('lib/supabase/config.ts', 'utf8');
          if (!source.includes('NEXT_PUBLIC_SUPABASE_URL') || !source.includes('NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY')) {
            throw new Error('Supabase config must use deployment environment variables');
          }
          if (/PRODUCTION_SUPABASE|SUPABASE_ANON_KEY = ['"]/.test(source)) {
            throw new Error('Supabase credentials must not be hardcoded');
          }
          console.log('Supabase config is environment-driven');
          NODE

      - name: Runtime smoke test
        shell: bash
        run: |
          npm run start > /tmp/uptrendify-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          node --input-type=module <<'NODE'
          const publicRoutes = ['/', '/progress', '/register', '/login', '/forgot-password', '/reset-password', '/api/health'];
          const protectedRoutes = ['/dashboard', '/brands', '/content', '/onboarding'];
          const deadline = Date.now() + 30000;

          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:3000/api/health', { cache: 'no-store' });
              if (response.ok) break;
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }

          for (const route of publicRoutes) {
            const response = await fetch('http://127.0.0.1:3000' + route, { redirect: 'manual', cache: 'no-store' });
            if (response.status >= 500) {
              throw new Error(route + ' returned ' + response.status);
            }
            console.log(route + ' -> ' + response.status);
          }

          for (const route of protectedRoutes) {
            const response = await fetch('http://127.0.0.1:3000' + route, { redirect: 'manual', cache: 'no-store' });
            if (response.status < 300 || response.status >= 400) {
              throw new Error(route + ' should redirect anonymously, got ' + response.status);
            }
            const location = response.headers.get('location') || '';
            if (!location.endsWith('/login')) {
              throw new Error(route + ' redirected to unexpected location: ' + location);
            }
            console.log(route + ' -> ' + response.status + ' -> ' + location);
          }

          const health = await (await fetch('http://127.0.0.1:3000/api/health', { cache: 'no-store' })).json();
          if (!health.integrations?.supabase) {
            throw new Error('Supabase runtime configuration is missing');
          }
          if (process.env.CI_SUPABASE_DB_SMOKE === '1' && !health.integrations?.supabaseDbReachable) {
            throw new Error('Supabase DB smoke check failed: ' + JSON.stringify(health.integrations));
          }
          console.log('Supabase runtime configuration: present');

          NODE

          echo "----- Next.js runtime log -----"
          cat /tmp/uptrendify-next.log
