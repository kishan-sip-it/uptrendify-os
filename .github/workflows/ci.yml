name: UpTrendifyOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Runtime smoke test
        shell: bash
        run: |
          npm run start > /tmp/uptrendify-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          node --input-type=module <<'NODE'
          const routes = ['/', '/progress', '/register', '/login', '/forgot-password', '/reset-password', '/api/health'];
          const deadline = Date.now() + 30000;

          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:3000/api/health', { cache: 'no-store' });
              if (response.ok) break;
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }

          for (const route of routes) {
            const response = await fetch('http://127.0.0.1:3000' + route, { redirect: 'manual', cache: 'no-store' });
            if (response.status >= 500) {
              throw new Error(route + ' returned ' + response.status);
            }
            console.log(route + ' -> ' + response.status);
          }

          const health = await (await fetch('http://127.0.0.1:3000/api/health', { cache: 'no-store' })).json();
          if (!health.integrations?.supabase || !health.integrations?.supabaseDbReachable) {
            throw new Error('Supabase runtime smoke check failed: ' + JSON.stringify(health.integrations));
          }
          console.log('Supabase runtime: reachable');
          NODE

          echo "----- Next.js runtime log -----"
          cat /tmp/uptrendify-next.log
